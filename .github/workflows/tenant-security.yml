name: StateHubs Tenant Security
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/tenant-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/tenant-security.yml'
permissions:
  contents: read
jobs:
  postgres-rls:
    name: PostgreSQL 16 negative isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: statehubs_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d statehubs_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: statehubs_security
      PGOPTIONS: "-c client_min_messages=warning"
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap isolated Supabase-compatible test schemas
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase10_bootstrap.sql
      - name: Apply legacy database migrations
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20261010120000_crm_builder.sql \
            supabase/migrations/20261012120000_crm_google.sql \
            supabase/migrations/20261012130000_crm_instagram.sql \
            supabase/migrations/20261012161000_meta_lead_ingestion.sql \
            supabase/migrations/20261012180000_property_media.sql
          do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Seed legacy tenants and expand phase 09
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/phase10_legacy_fixtures.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012193000_saas_organizations_expand.sql
      - name: Harden tenant access and run negative checks
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012200000_tenant_security_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012210000_global_org_preferences.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013090000_workspace_access_platform_admin.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013120000_record_activity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013140000_match_decisions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013160000_deal_offer_history.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013170000_commission_ledger.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013180000_commission_reversals.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/phase10_negative_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/workspace_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/record_activity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/match_decisions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/deal_offers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/commission_ledger.sql
          bash supabase/tests/commission_concurrency.sh
          psql -v ON_ERROR_STOP=1 -f supabase/tests/commission_reversals.sql
          bash supabase/tests/reversal_concurrency.sh
